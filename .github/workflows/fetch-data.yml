name: Fetch online data

# Manual only. This is a long crawl against public APIs (Wikidata plus one
# pageviews request per article), so it should not fire on every push. It exists
# because GitHub's runners have open internet where the authoring sandbox does
# not.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process the first N species (blank = all ~11,000)"
        required: false
        default: ""
      commit:
        description: "Commit the result (turn off for a quick verification run)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl shapely pyshp

      # Lets a re-run pick up where a timed-out or failed one stopped.
      - name: Restore crawl cache
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-

      - name: Crawl
        run: |
          python3 pipeline/fetch_online_data.py \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Belt and braces: an hour of crawling should survive anything that goes
      # wrong with the commit below.
      - name: Upload the result as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-data
          path: pipeline/raw/online_data.json
          if-no-files-found: warn

      - name: Commit the result
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/raw/online_data.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Refresh online species data (Wikidata, pageviews, continents)"
          # main will have moved on during a run this long; rebasing keeps the
          # push from being rejected and the crawl from being wasted.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
